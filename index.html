<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Dog walking and home stays in Auckland"
        />
        <title>Pooch</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Space+Grotesk:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header>
            <h1 class="logo">POOCH</h1>
        </header>

        <main>
            <div class="card-services">
                <div class="service">
                    <i class="fa-solid fa-paw" aria-hidden="true"></i>
                    <span>Weekend Walks</span>
                </div>
                <div class="service-divider"></div>
                <div class="service">
                    <i class="fa-solid fa-house" aria-hidden="true"></i>
                    <span>Home Stays</span>
                </div>
                <div class="service-divider"></div>
                <div class="service">
                    <i class="fa-solid fa-car" aria-hidden="true"></i>
                    <span>Pick Up &amp; Drop Off</span>
                </div>
            </div>

            <div class="card-middle">
                <p class="body-text">
                    Need someone to look after your dog over the weekend?
                </p>
                <p class="body-text">
                    Contact us for a day walk, or to stay the whole weekend!
                </p>
            </div>

            <div class="card-bottom">
                <a href="mailto:hello@poochdogs.co.nz" class="contact-email"
                    >hello@poochdogs.co.nz</a
                >
                <div class="contact-phones">
                    <a href="tel:021991675">Fleur: 021 991 675</a>
                    <a href="tel:0211754020">Lou: 021 175 4020</a>
                </div>
                <div class="contact-social">
                    <a
                        href="https://facebook.com/poochdogsnz"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Facebook"
                        ><i class="fa-brands fa-facebook"></i
                    ></a>
                    <a
                        href="https://instagram.com/poochdogsnz"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Instagram"
                        ><i class="fa-brands fa-instagram"></i
                    ></a>
                </div>
            </div>
        </main>

        <div class="badge">
            <span>Weekday Walks<br />coming 2027</span>
        </div>

        <script src="script.js"></script>
    </body>
</html>
